<style>
/* Restraint first. Two piano gestures only: the lacquered fallboard header with its red key-slip,
   and the open piano on the first screen (strings above, a row of real keys along the bottom edge).
   Everything else is photography, prose and white space. The site keeps one look and ignores OS dark mode. */
:root{
  --lacquer:#0C0B0E; --lacquer-2:#141217; --line-n:#2A2630;
  --ivory:#F4F1EB; --line-d:#D9D3C8;
  --ink:#16141A; --ink-2:#4A4650; --mute:#857F8A;
  --felt:#A3192F; --felt-2:#BC2840;
  --brass:#C9A35C;
  --on-n:#EEE9E0; --on-n-2:#A39CA6;
  --display:"Noto Serif Display","Noto Serif",Georgia,serif;
  --body:"Be Vietnam Pro","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--lacquer);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;font-weight:300;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--lacquer)}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:300;margin:0;line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
figure{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.day{background:var(--ivory);color:var(--ink)}
.night{background:var(--lacquer);color:var(--on-n)}
.night .soft{color:var(--on-n-2)}
.day .soft{color:var(--ink-2)}

/* actions */
.btn{display:inline-block;padding:15px 26px;background:var(--felt);color:#fff;text-decoration:none;font-size:15px;font-weight:400;letter-spacing:.02em;transition:background .25s}
.btn:hover{background:var(--felt-2)}
.tl{text-decoration:none;font-size:15px;font-weight:400;border-bottom:1px solid currentColor;padding-bottom:3px;transition:opacity .2s}
.tl:hover{opacity:.7}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:18px 32px}
.num{font-size:15px;letter-spacing:.04em;color:var(--mute)}

/* fallboard */
.fall{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(180deg,#1A181D 0%,#0C0B0E 60%,#070608 100%);color:var(--on-n)}
.fall-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;min-height:76px}
.fall nav{display:flex;gap:30px;font-size:14.5px;font-weight:400}
.fall nav a{text-decoration:none;color:var(--on-n-2);padding-block:6px;border-bottom:1px solid transparent;transition:color .2s}
.fall nav a:hover,.fall nav a.on{color:var(--on-n)}
.fall nav a.on{border-bottom-color:var(--felt)}
.fall-r{display:flex;align-items:center;justify-content:flex-end;gap:30px}
.mark{display:grid;justify-items:center;text-decoration:none;gap:3px}
.mark-name{font-family:var(--display);font-size:28px;font-style:italic;font-weight:300;letter-spacing:.01em;line-height:1.1;background:linear-gradient(100deg,#8C7140 0%,#E8D29B 38%,#C9A35C 55%,#F2E2B4 70%,#9C7E45 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark-sub{font-size:9.5px;letter-spacing:.44em;color:var(--brass);padding-left:.44em;font-weight:400}
.lang{background:none;border:0;padding:6px 0;font-size:12.5px;letter-spacing:.14em;cursor:pointer;color:var(--on-n-2)}
.lang b{color:var(--on-n);font-weight:500}
.slip{height:3px;background:linear-gradient(90deg,#7A1222,#B3233A 50%,#7A1222)}
.burger{display:none;background:none;border:0;padding:10px 0 10px 10px;cursor:pointer;color:var(--on-n)}
.burger span{display:block;width:22px;height:1px;background:currentColor;margin:6px 0}
.drawer{position:fixed;inset:0;z-index:70;background:var(--lacquer);color:var(--on-n);padding:calc(env(safe-area-inset-top,0px) + 20px) max(24px,env(safe-area-inset-right,0px)) 28px max(24px,env(safe-area-inset-left,0px));display:grid;align-content:start}
.drawer .x{justify-self:end;background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--on-n);padding:8px 0 24px}
.drawer a{font-family:var(--display);font-size:38px;font-weight:300;text-decoration:none;padding:10px 0}

/* first screen: the open piano */
.hero{position:relative;overflow:hidden;background:var(--lacquer);color:var(--on-n)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--lacquer) 0%,rgba(12,11,14,.9) 36%,rgba(12,11,14,.3) 66%,rgba(12,11,14,.1) 100%)}
.hero-in{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:56px;align-items:center;min-height:min(80vh,780px);padding-block:80px 72px}
.name{font-size:clamp(68px,10vw,144px);line-height:.9;letter-spacing:-.03em}
.hero p{margin-top:30px;font-size:18px;max-width:27em;color:var(--on-n-2);text-wrap:pretty}
.hero .acts{margin-top:44px}
.grand{justify-self:center;width:min(100%,330px)}
.grand svg{display:block;width:100%;height:auto;filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
.kbd{position:relative;z-index:3;display:flex;height:60px;border-top:3px solid var(--felt);user-select:none;-webkit-user-select:none;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.kbd .w{flex:1;min-width:0;padding:0;border:0;border-right:1px solid #2A262C;border-radius:0 0 3px 3px;background:linear-gradient(180deg,#EDE9E1 0%,#FFFFFF 22%,#F7F4EE 82%,#E2DDD3 100%);cursor:pointer;transition:background .06s}
.kbd .w.down{background:linear-gradient(180deg,#DDD7CC,#E9E4DA 70%,#D6D0C4)}
.kbd .b{position:absolute;top:0;height:60%;padding:0;border:0;border-radius:0 0 3px 3px;background:linear-gradient(180deg,#26232A,#0A090C 88%);box-shadow:0 3px 4px rgba(0,0,0,.35),inset 0 -5px 0 rgba(255,255,255,.06);cursor:pointer;z-index:2}
.kbd .b.down{background:#1C1A20;box-shadow:inset 0 -2px 0 rgba(255,255,255,.04)}

/* statement */
.stmt{padding-block:clamp(96px,13vw,176px)}
.stmt p{font-family:var(--display);font-weight:300;font-size:clamp(27px,3.4vw,44px);line-height:1.3;max-width:23em;margin-left:clamp(0px,8vw,110px)}
.stmt .tl{display:inline-block;margin:48px 0 0 clamp(0px,8vw,110px)}

/* two doors */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--lacquer)}
.door{position:relative;display:block;width:100%;aspect-ratio:4/5;max-height:92vh;overflow:hidden;color:#fff;text-decoration:none;background:var(--lacquer-2)}
.door img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}
.door:hover img{transform:scale(1.035)}
.door::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(180deg,transparent,rgba(8,7,9,.72))}
.door span{position:absolute;z-index:2;left:clamp(24px,4vw,56px);bottom:clamp(26px,4vw,56px);font-family:var(--display);font-size:clamp(42px,5.6vw,80px);font-weight:300;line-height:1;letter-spacing:-.02em}

/* listen */
.listen{padding-block:clamp(96px,11vw,150px)}
.listen h2,.sec-h{font-size:clamp(40px,5.2vw,68px);margin-bottom:clamp(40px,5vw,64px)}
.reels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,24px)}
.reel{display:grid;gap:16px;text-decoration:none;color:inherit}
.reel figure{position:relative;aspect-ratio:9/14;overflow:hidden;background:var(--lacquer-2)}
.reel img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .4s}
.reel:hover img{transform:scale(1.04)}
.reel figure::after{content:"";position:absolute;left:16px;bottom:16px;border-left:11px solid rgba(255,255,255,.92);border-top:7px solid transparent;border-bottom:7px solid transparent;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.reel b{font-family:var(--display);font-style:italic;font-weight:300;font-size:19px;line-height:1.3}

/* page heads */
.ph{padding-block:clamp(64px,9vw,128px)}
.ph-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);gap:clamp(40px,8vw,120px);align-items:end}
.ph h1{font-size:clamp(58px,8.4vw,120px);line-height:.92;letter-spacing:-.03em}
.ph p{margin-top:36px;font-size:18.5px;max-width:34ch}
.ph figure{aspect-ratio:3/4;overflow:hidden;background:var(--lacquer-2)}
.ph figure img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}

/* two languages */
.bi{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-d)}
.bi > div{padding-block:clamp(64px,8vw,104px)}
.bi > div:first-child{padding-right:clamp(32px,6vw,88px)}
.bi > div + div{border-left:1px solid var(--line-d);padding-left:clamp(32px,6vw,88px);display:flex;align-items:center}
.bi h2{font-size:clamp(30px,3.2vw,42px);margin-bottom:24px}
.bi p{max-width:36em}
.aside{font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(25px,2.7vw,36px);line-height:1.32;color:var(--ink-2)}

/* closing call */
.cta{padding-block:clamp(96px,12vw,160px);border-top:1px solid var(--line-d)}
.night.cta{border-top-color:var(--line-n)}
.cta h2{font-size:clamp(38px,5.2vw,68px);max-width:15ch}
.cta .acts{margin-top:44px}

/* performance styles */
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,3vw,40px);padding-bottom:clamp(96px,11vw,150px)}
.style{display:grid;gap:20px;text-decoration:none;color:inherit;align-content:start}
.style figure{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--lacquer-2)}
.style img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.style:hover img{transform:scale(1.035)}
.style figure::after{content:"";position:absolute;left:18px;bottom:18px;border-left:11px solid rgba(255,255,255,.92);border-top:7px solid transparent;border-bottom:7px solid transparent;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.style h3{font-size:clamp(28px,2.8vw,38px)}
.style i{font-family:var(--display);font-weight:300;font-size:18px;color:var(--on-n-2);margin-top:-8px}

/* venues */
.venues{padding-block:clamp(96px,11vw,150px);border-top:1px solid var(--line-n)}
.venues p{font-family:var(--display);font-weight:300;font-size:clamp(27px,3.4vw,44px);line-height:1.32;max-width:22em;color:var(--on-n-2);margin-left:clamp(0px,8vw,110px)}
.venues b{font-weight:300;color:var(--on-n)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1fr);gap:clamp(40px,8vw,120px);align-items:start;padding-block:clamp(64px,9vw,128px)}
.about figure{position:sticky;top:110px;aspect-ratio:3/4;overflow:hidden;background:var(--lacquer-2)}
.about figure img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.about h1{font-size:clamp(58px,8vw,112px);line-height:.92;letter-spacing:-.03em}
.prose{margin-top:44px;max-width:36em}
.prose .lead{font-family:var(--display);font-weight:300;font-size:clamp(23px,2.3vw,29px);line-height:1.4;color:var(--ink)}
.prose p + p{margin-top:24px}
.prose p{color:var(--ink-2)}
.about .acts{margin-top:52px}

/* contact */
.zl{margin-top:48px;display:grid;gap:6px}
.zl span{font-size:14px;letter-spacing:.06em;color:var(--on-n-2)}
.zl a{font-family:var(--display);font-weight:300;font-size:clamp(42px,6vw,78px);line-height:1;text-decoration:none;letter-spacing:-.01em}
.zl a:hover{color:#fff}
.soc{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px 28px}
.city{margin-top:40px}

/* link-in-bio */
.links{min-height:calc(100vh - 79px);display:grid;justify-items:center;align-content:start;padding:56px 24px 96px;text-align:center}
.av{width:104px;height:104px;border-radius:50%;overflow:hidden;margin-bottom:22px}
.av img{width:100%;height:100%;object-fit:cover}
.links h1{font-size:40px}
.lk{display:grid;width:min(100%,420px);margin-top:40px;border-top:3px solid var(--felt)}
.lk a{display:block;text-align:left;background:linear-gradient(90deg,#FFFFFF,#F3EFE8 85%,#E2DCD1);color:var(--ink);text-decoration:none;padding:19px 24px;border-bottom:1px solid #2A262C;border-radius:0 0 6px 0;font-weight:400;transition:transform .08s,background .2s}
.lk a:hover{background:linear-gradient(90deg,#FFFFFF,#ECE7DE 85%,#DAD3C6)}
.lk a:active{transform:translateY(2px)}

/* footer */
footer{background:var(--lacquer);color:var(--on-n-2);border-top:1px solid var(--line-n);font-size:15px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px;padding-block:64px 28px}
.foot nav{display:flex;flex-wrap:wrap;gap:10px 28px}
.foot a{text-decoration:none;transition:color .2s}
.foot a:hover{color:var(--on-n)}
.end{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:36px;font-size:13px}
.bar{display:inline-block;width:9px;height:30px;border-left:1px solid var(--brass);border-right:4px solid var(--brass);margin-left:3px}

/* Zalo key */
.fab.away{opacity:0;pointer-events:none;transform:translateY(8px)}
.fab{transition:opacity .3s,transform .3s;position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;text-decoration:none;background:linear-gradient(180deg,#26232A,#0A090C);color:var(--on-n);padding:14px 16px 12px;border-radius:0 0 6px 6px;border-top:3px solid var(--felt);box-shadow:0 10px 28px rgba(0,0,0,.35);font-size:13px;font-weight:400;letter-spacing:.04em}

@media (max-width: 980px){
  .fall nav{display:none}
  .burger{display:block}
  .fall-in{grid-template-columns:auto 1fr auto;min-height:66px}
  .mark{justify-items:start;order:-1}
  .fall-l{display:none}
  .mark-name{font-size:24px}
  .reels{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 760px){
  body{font-size:16.5px}
  .hero::after{background:linear-gradient(180deg,rgba(12,11,14,.25) 0%,rgba(12,11,14,.75) 48%,rgba(12,11,14,.95) 100%)}
  .hero-in{grid-template-columns:minmax(0,1fr);gap:40px;min-height:0;padding-block:44px 52px}
  .grand{width:min(70%,270px);order:-1}
  .name{font-size:clamp(58px,17vw,84px)}
  .kbd{height:52px}
  .doors{grid-template-columns:1fr}
  .ph-in,.about,.bi{grid-template-columns:minmax(0,1fr)}
  .ph-in{align-items:start}
  .ph figure{order:-1;aspect-ratio:4/5}
  .bi > div:first-child{padding-right:0}
  .bi > div + div{border-left:0;border-top:1px solid var(--line-d);padding-left:0}
  .about figure{position:relative;top:0;aspect-ratio:4/5}
  .styles{grid-template-columns:minmax(0,1fr);gap:56px}
  .stmt p,.stmt .tl,.venues p{margin-left:0}
  .foot{align-items:flex-start;flex-direction:column}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;scroll-behavior:auto !important}}
</style>

var actx=null, master=null;
function ac(){
  if(!actx){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    actx=new C(); master=actx.createGain(); master.gain.value=.7;
    var comp=actx.createDynamicsCompressor(); master.connect(comp); comp.connect(actx.destination); }

}
function tone(m,vel){
  var a=ac(); if(!a) return;
  var t=a.currentTime, f=440*Math.pow(2,(m-69)/12), v=vel||.9, dur=Math.max(1.2,4.2-(m-40)*0.05);
  var out=a.createGain();

  out.gain.exponentialRampToValueAtTime(.11*v,t+.32); out.gain.exponentialRampToValueAtTime(.0001,t+dur);
  var lp=a.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.setValueAtTime(Math.min(16000,f*10),t); lp.frequency.exponentialRampToValueAtTime(Math.min(9000,f*3),t+.7);
  [[1,.62,"triangle"],[2,.26,"sine"],[3,.12,"sine"],[4,.06,"sine"],[5.03,.035,"sine"],[0.5,.05,"sine"]].forEach(function(p,k){
    var o=a.createOscillator(); o.type=p[2]; o.frequency.value=f*p[0]*(1+(k?0.0007*k:0));
    var g=a.createGain(); g.gain.value=p[1]; o.connect(g); g.connect(lp); o.start(t); o.stop(t+dur+.05);

}

var SC=null;
function Strings(cv){
  var ctx=cv.getContext("2d"), N=64, NB=18, amp=new Float32Array(N), ph=new Float32Array(N), W=0,H=0,dpr=1, raf=0, geo=[], alive=true, lo=21, hi=108;

    var r=cv.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);

    geo=[]; var left=W*0.38, right=W*0.99; if(W<760){ left=W*0.0; right=W*1.0; }
    var span=right-left;

      if(i<NB){ var u=i/(NB-1);
        g={x0:left+span*(0.00+0.30*u), y0:H*1.02, x1:left+span*(0.34+0.26*u), y1:H*(0.02+0.03*u), w:2.2-0.9*u, c:"rgba(196,150,84,", base:.42};
      } else { var u2=(i-NB)/(N-NB-1), x0=left+span*(0.26+0.72*u2);
        g={x0:x0, y0:H*1.0, x1:x0-span*0.05, y1:H*(0.06+0.66*Math.pow(u2,1.25)), w:1.1-0.55*u2, c:"rgba(222,214,200,", base:.24};
      }
      g.len=Math.hypot(g.x1-g.x0,g.y1-g.y0); g.nx=-(g.y1-g.y0)/g.len; g.ny=(g.x1-g.x0)/g.len; g.u=i/(N-1); geo.push(g);
    }
    draw(performance.now());
  }
  function draw(now){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    var cx=W<760?W*0.5:W*0.72, grd=ctx.createRadialGradient(cx,H*0.45,10,cx,H*0.45,Math.max(W,H)*0.55);
    grd.addColorStop(0,"rgba(201,163,92,0.13)"); grd.addColorStop(1,"rgba(201,163,92,0)"); ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);

    var u=(m-lo)/Math.max(1,hi-lo), i=Math.round(Math.max(0,Math.min(1,u))*(N-1));
